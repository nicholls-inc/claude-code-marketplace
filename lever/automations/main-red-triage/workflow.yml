# lever-main-red-triage: classify default-branch CI failures (flake/regression/infra), act once, keep one issue per cause.
# Model: sonnet (standard) because classification is log reading plus a small decision; use opus only if log reading is the bottleneck, and record why here.
# Install: copy to .github/workflows/lever-main-red-triage.yml and prompt.md to .github/lever/automations/main-red-triage/prompt.md.
# For ACTION: fix_pr, change `contents` and `pull-requests` to write and add the git/gh pr tools shown at the bottom.
name: lever-main-red-triage
on:
  workflow_run:
    workflows: ["CI"]            # WATCHED_WORKFLOWS: the exact `name:` of your CI workflow(s)
    types: [completed]
  schedule:
    - cron: "17 * * * *"         # hourly sweep: missed events, and did the rerun pass / the fix PR land
  workflow_dispatch:
    inputs:
      mode: { type: choice, options: [dry_run, act], default: dry_run }
      resource_url: { type: string, required: false, description: "Failed run URL to classify" }
concurrency:
  group: lever-main-red-triage-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false
jobs:
  run:
    # Created paused: event and schedule paths run only once LEVER_MAIN_RED_TRIAGE_LIVE=true; dispatch always runs.
    # Filter at the trigger: only failed runs on the default branch (the prompt re-checks), never our own echoes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.LEVER_MAIN_RED_TRIAGE_LIVE == 'true' &&
       github.actor != 'claude[bot]' && github.actor != 'github-actions[bot]' &&
       (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'failure' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write          # rerun failed jobs
      issues: write           # one issue per cause
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            MODE: ${{ inputs.mode || 'act' }}
            TRIGGER: ${{ github.event_name }}
            RESOURCE: ${{ inputs.resource_url || github.event.workflow_run.html_url || 'sweep' }}
            Follow .github/lever/automations/main-red-triage/prompt.md exactly.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 25
            --allowedTools "Read,Grep,Glob,Bash(gh run list:*),Bash(gh run view:*),Bash(gh run rerun:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue comment:*)"
          # ACTION: fix_pr adds: Edit,Write,Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*)
          # L3 test-only-main-fix grant adds: Bash(gh pr merge:*)   (never otherwise)
