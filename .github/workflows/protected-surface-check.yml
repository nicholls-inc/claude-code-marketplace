name: Protected Surface Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  detect-protected-changes:
    runs-on: ubuntu-latest
    outputs:
      protected_changed: ${{ steps.detect.outputs.protected_changed }}
      files: ${{ steps.detect.outputs.files }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute changed files vs base
        id: diff
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" > changed-files.txt
          cat changed-files.txt

      - name: Check changed files against protected globs
        id: detect
        run: |
          # Parse the fenced glob block under the "## Machine-readable path list"
          # heading in .claude/rules/protected-surfaces.md — that file is the
          # single source of truth for what is protected. Anchor on the heading
          # so earlier fenced blocks in the file cannot empty the list.
          awk '/^## Machine-readable path list/{h=1; next} h && /^```/{c++; next} h && c==1' .claude/rules/protected-surfaces.md > protected-globs.txt
          cat protected-globs.txt

          matched=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            while IFS= read -r glob; do
              [ -z "$glob" ] && continue
              case "$file" in
                $glob) matched="${matched}${file}\n" ;;
              esac
            done < protected-globs.txt
          done < changed-files.txt

          if [ -n "$matched" ]; then
            echo "protected_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "protected_changed=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "files<<EOF"
            printf '%b' "$matched"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  intent-check:
    needs: detect-protected-changes
    if: needs.detect-protected-changes.outputs.protected_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Require ANTHROPIC_API_KEY
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is empty — protected-surface-check cannot run /intent-check without it. Ask a repo admin to set the secret." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive gate link from git remote
        id: gate-link
        run: |
          url=$(git remote get-url origin)
          slug=$(echo "$url" | sed -E 's#^git@github\.com:##; s#^https://github\.com/##; s#\.git$##')
          echo "url=https://github.com/${slug}/blob/main/docs/gates/intent-check-verdict.md" >> "$GITHUB_OUTPUT"

      - name: Run intent-check on touched protected modules
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            The following protected-surface files changed in this pull request:

            ${{ needs.detect-protected-changes.outputs.files }}

            Run the crosscheck skill /intent-check non-interactively (orchestrator
            marker mode, per crosscheck/docs/orchestrator-coordination.md section 1)
            against the modules touched by these files. Write the resulting
            attestation to a path matching **/.assurance/intent-check-attestation.json
            as the skill normally does. Do not prompt for human sign-off in this
            run — this workflow's own check-run step surfaces the verdict for
            human review instead.
          claude_args: |
            --allowedTools "Read,Write,Edit,Bash,Skill,Glob,Grep"

      - name: Publish intent-check attestation as a check run
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            function findAttestation(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  if (entry.name === 'node_modules' || entry.name === '.git') continue;
                  const found = findAttestation(full);
                  if (found) return found;
                } else if (full.endsWith('.assurance/intent-check-attestation.json')) {
                  return full;
                }
              }
              return null;
            }

            const found = findAttestation(process.cwd());
            if (!found) {
              core.setFailed('No **/.assurance/intent-check-attestation.json produced by /intent-check.');
              return;
            }

            const attestation = JSON.parse(fs.readFileSync(found, 'utf8'));
            const remoteUrl = require('child_process')
              .execSync('git remote get-url origin')
              .toString()
              .trim();
            const slug = remoteUrl
              .replace(/^git@github\.com:/, '')
              .replace(/^https:\/\/github\.com\//, '')
              .replace(/\.git$/, '');
            const gateLink = `https://github.com/${slug}/blob/main/docs/gates/intent-check-verdict.md`;

            const summaryHeader =
              '**Action needed: review the intent-check verdict**\n' +
              'You are being asked to review the intent-check verdict because ' +
              'protected-surface files changed in this pull request. Approving ' +
              'means the verdict is accepted and the PR can proceed; declining ' +
              `means the code, test, or invariant must be amended first. Full explanation: ${gateLink}\n\n`;

            const verdictLine = attestation.verdict
              ? `Verdict: \`${attestation.verdict}\`\n\n`
              : '';

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'crosscheck / intent-check',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: attestation.verdict === 'fail' ? 'failure' : 'success',
              output: {
                title: 'intent-check verdict',
                summary: summaryHeader + verdictLine + '```json\n' + JSON.stringify(attestation, null, 2) + '\n```',
              },
            });
