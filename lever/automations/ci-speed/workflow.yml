# lever-ci-speed: one workflow, two jobs. `watch` (cheap, daily) measures time-to-green and files ONE goal issue when a target is missed.
# `lane` (premium, capped) wakes on the ci-goal label, runs paired experiment arms on real CI, hands owners a measured PR stack.
# Models: watch = sonnet (standard) because it measures and files one issue. lane = opus (premium) because judging paired-run evidence and
# writing reviewable changes is the whole job; the lane is gated by the watch, the label, one-goal-at-a-time and a daily run limit.
# Install: copy to .github/workflows/lever-ci-speed.yml and prompt.md to .github/lever/automations/ci-speed/prompt.md.
# The prompt follows the experiment-arms skill: commit a copy of the lever plugin's skills/experiment-arms/ to .claude/skills/experiment-arms/ in this repo.
name: lever-ci-speed
on:
  schedule:
    - cron: "47 4 * * *"         # daily, off-peak (UTC). The watch runs here.
  issues:
    types: [labeled]             # the lane wakes here; the job `if:` passes only the ci-goal label
  workflow_dispatch:
    inputs:
      role: { type: choice, options: [watch, lane], default: watch }
      mode: { type: choice, options: [dry_run, act], default: dry_run }
      resource_url: { type: string, required: false, description: "Goal issue URL (lane)" }
jobs:
  watch:
    # Created paused: the schedule runs only once LEVER_CI_SPEED_LIVE=true; dispatch always runs.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.role == 'watch') ||
      (github.event_name == 'schedule' && vars.LEVER_CI_SPEED_LIVE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: lever-ci-speed-watch
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write             # open/update ONE goal issue, add the ci-goal label
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            ROLE: watch
            MODE: ${{ inputs.mode || 'act' }}
            Follow .github/lever/automations/ci-speed/prompt.md exactly (ROLE: watch section).
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(python3 .claude/skills/experiment-arms/scripts/ci_arm_metrics.py:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue edit:*)"
  lane:
    # The watch's label (applied with the Claude GitHub App token) wakes this job, so the usual claude[bot] actor guard is deliberately
    # NOT applied here and `allowed_bots` is set below: this is the one place bot-caused events are allowed. Loops are stopped by
    # (1) one open goal at a time (a second label event on an owned goal is NOOP(owned)), (2) the daily run limit in the prompt
    # (LANE_RUNS_PER_DAY, start at 2), (3) the concurrency group below.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.role == 'lane') ||
      (github.event_name == 'issues' && vars.LEVER_CI_SPEED_LIVE == 'true' && github.event.label.name == 'ci-goal')
    runs-on: ubuntu-latest
    timeout-minutes: 360         # hosted-runner maximum; progress is written to the goal issue, so a timed-out run can be resumed by dispatch
    concurrency:
      group: lever-ci-speed-lane
      cancel-in-progress: false
    permissions:
      contents: write           # push do-not-merge arm branches. The default token cannot push .github/workflows/ changes; keep it that way.
      pull-requests: write
      issues: write
      actions: write            # rerun failed arm jobs
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "claude"
          prompt: |
            ROLE: lane
            MODE: ${{ inputs.mode || 'act' }}
            RESOURCE: ${{ inputs.resource_url || github.event.issue.html_url }}
            Follow .github/lever/automations/ci-speed/prompt.md exactly (ROLE: lane section).
          claude_args: |
            --model claude-opus-5-5
            --max-turns 200
            --allowedTools "Read,Write,Edit,Grep,Glob,Bash(python3 .claude/skills/experiment-arms/scripts/ci_arm_metrics.py:*),Bash(python3 .claude/skills/experiment-arms/scripts/ci_arm_driver.py:*),Bash(python3 .claude/skills/experiment-arms/scripts/arm_stats.py:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin ci-arm/*),Bash(git log:*),Bash(git diff:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh run rerun:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr ready:*),Bash(gh pr close:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh issue close:*)"
          # No `gh run cancel`: the lane never relies on cancelling a run; it pushes a new commit or waits.
          # `gh pr merge` only with a standing grant. Never gh workflow enable|disable.
