name: Spec Audit

on:
  pull_request:
    paths:
      - "**/spec.md"
      - "formal-verification/specs/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  spec-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Require ANTHROPIC_API_KEY
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is empty — spec-audit cannot run without it. Ask a repo admin to set the secret." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive gate link from git remote
        id: gate-link
        run: |
          url=$(git remote get-url origin)
          # normalise git@github.com:owner/repo(.git) and https://github.com/owner/repo(.git)
          slug=$(echo "$url" | sed -E 's#^git@github\.com:##; s#^https://github\.com/##; s#\.git$##')
          echo "url=https://github.com/${slug}/blob/main/docs/gates/audit-spec-coverage-triage.md" >> "$GITHUB_OUTPUT"

      - name: Determine changed spec files
        id: changed
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          files=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" -- '**/spec.md' 'formal-verification/specs/**')
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run crosscheck spec audit skills
        id: audit
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run a non-interactive orchestrator-marker-mode audit of the spec files
            changed in this pull request:

            ${{ steps.changed.outputs.files }}

            Follow "orchestrator marker mode" as documented in
            crosscheck/docs/orchestrator-coordination.md (section 1): write a
            valid session marker at .assurance/add-session-<id>/session.json
            before invoking each skill, so the skills' in-skill governance gates
            are suppressed in favour of this workflow's single PR comment.

            1. Invoke the crosscheck skill /audit-spec-coverage against the
               changed spec files.
            2. Invoke the crosscheck skill /audit-invariant-consistency against
               the same changed spec files.
            3. Both skills must write their findings files per the standard
               findings-file convention in orchestrator-coordination.md
               (section 2) — do not print findings only to chat.
            4. Do not sign off, triage, or resolve any finding yourself. This
               run only produces findings files for human triage.

            After both skills finish, post exactly one PR comment. The comment
            must begin with these three lines, verbatim except the bracketed
            text:

            **Action needed: triage the spec audit findings**
            You are being asked to triage the spec audit findings because the
            changed spec files may have coverage or consistency gaps.
            Approving means the findings are accepted, amended, or deferred per
            the 4-path triage; declining means the PR is blocked until the
            findings are addressed. Full explanation: ${{ steps.gate-link.outputs.url }}

            Follow that fixed opening with a short summary of what each skill
            found (counts by category is sufficient) and the paths to the
            findings files this run wrote.
          claude_args: |
            --allowedTools "Read,Write,Edit,Bash,Skill,Glob,Grep"
